    const existing = findApp(id);
    const updated = { ...existing, ...data, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(existing, updated);
    await audit('Application Status Change','Application', id, existing, updated);
    toast('Application updated','ok');
  } else {
    const rec = { ...data, allotmentStatus:'Pending Decision', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const newId = await putRec('applications', rec); rec.id = newId; S.applications.push(rec);
    await audit('Application Creation','Application', newId, null, rec);
    toast('Application created','ok');
  }
  closeModal(); navigate('applications');
}
function deleteApplication(id){
  confirmAction('Delete this application record? This will remove associated history from reporting.', async () => {
    const a = findApp(id);
    await delRec('applications', id);
    S.applications = S.applications.filter(x=>x.id!==id);
    await audit('Application Status Change','Application', id, a, null);
    toast('Application deleted','ok'); navigate('applications');
  });
}

/* ---- bulk apply from plan ---- */
function bulkApplyFromPlan(){
  const openPlans = S.ipoPlans.filter(p=>p.planStatus!=='Cancelled');
  const opts = openPlans.map(p=>{ const ipo=findIpo(p.ipoId); const bank=findBank(p.bankAccountId); return `<option value="${p.id}">${escapeHtml(ipo?ipo.ipoName:'')} · ${escapeHtml(bank?bank.bankName:'')} · ${fmtDate(p.plannedDate)}</option>`; }).join('');
  openModal('Bulk Apply from Plan',
    `<div class="f-group"><label>Select Plan</label><select id="baPlan" onchange="renderBulkApplyClients()"><option value="">Select a plan</option>${opts}</select></div>
     <div id="baClientsWrap" style="margin-top:12px;"></div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitBulkApply()">Mark Selected as Applied</button>`, true);
}
function renderBulkApplyClients(){
  const planId = Number(document.getElementById('baPlan').value);
  const wrap = document.getElementById('baClientsWrap');
  if (!planId){ wrap.innerHTML=''; return; }
  const plan = findPlan(planId);
  const plannedClientIds = S.plannedClients.filter(pc=>pc.planId===planId).map(pc=>pc.clientId);
  const bankOpts = S.bankAccounts.filter(b=>b.status==='Active').map(b=>`<option value="${b.id}" ${b.id===plan.bankAccountId?'selected':''}>${escapeHtml(b.bankName)}</option>`).join('');
  const rows = plannedClientIds.map(cid=>{
    const c = findClient(cid);
    const already = S.applications.some(a=>a.planId===planId && a.clientId===cid);
    return `<tr>
      <td><label class="checkbox-row"><input type="checkbox" class="baClient" value="${cid}" ${already?'disabled':'checked'}> ${escapeHtml(c.clientId)} — ${escapeHtml(c.clientName)}</label></td>
      <td><input type="number" class="baAmt" data-cid="${cid}" placeholder="Amount" value="${findIpo(plan.ipoId)?.minimumApplicationAmount||''}" ${already?'disabled':''}></td>
      <td>${already?'<span class="badge gray">Already Applied</span>':''}</td>
    </tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="3">No clients mapped to this plan yet. Use "Clients" on the plan first.</td></tr>`;
  wrap.innerHTML = `
    <div class="form-grid one" style="margin-bottom:10px;">
      <div class="f-group"><label>Application Date</label><input type="date" id="baDate" value="${plan.plannedDate}"></div>
      <div class="f-group"><label>Bank Account</label><select id="baBank" onchange="refreshAppUpiField(this.value,'ba')">${bankOpts}</select></div>
      <div class="f-group"><label>UPI ID (applies to every application in this batch)</label><div id="baupiFieldWrap">${upiOptionsHtml(plan.bankAccountId, null).replace('fld_upiId','bafld_upiId').replace('upiFieldInner','baupiFieldInner')}</div></div>
    </div>
    <div class="table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Amount Applied</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
async function submitBulkApply(){
  const planId = Number(document.getElementById('baPlan').value);
  if (!planId){ toast('Select a plan first','warn'); return; }
  const date = document.getElementById('baDate').value;
  const bankAccountId = Number(document.getElementById('baBank').value);
  const upiEl = document.getElementById('bafld_upiId');
  const upiId = upiEl ? (upiEl.value ? Number(upiEl.value) : null) : null;
  const checked = Array.from(document.querySelectorAll('.baClient:checked:not(:disabled)'));
  if (!checked.length){ toast('No clients selected','warn'); return; }
  let count = 0;
  for (const chk of checked){
    const cid = Number(chk.value);
    const amt = Number(document.querySelector(`.baAmt[data-cid="${cid}"]`).value) || 0;
    const plan = findPlan(planId);
    const rec = { clientId:cid, ipoId:plan.ipoId, bankAccountId, applicationDate:date, upiId, amountApplied:amt,
      applicationStatus:'Applied', planId, allotmentStatus:'Pending Decision', allotmentDate:null, saleStatus:null, saleDate:null, saleAmount:null,
      calculatedGrossReceived:null, grossReceived:null, grossReceivedOverridden:false,
      calculatedOurProfit:null, ourProfit:null, ourProfitOverridden:false,
      calculatedClientProfit:null, clientProfit:null, clientProfitOverridden:false,
      createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() };
    const id = await putRec('applications', rec); rec.id = id; S.applications.push(rec);
    await audit('Application Creation','Application', id, null, rec);
    count++;
  }
  toast(`${count} application(s) created`, 'ok');
  closeModal(); navigate('applications');
}
</script>
<script>
/* =================== ALLOTMENTS & SALE =================== */
const ALLOTMENT_STATUSES = ['Pending Decision','Allotted','Not Allotted'];
const SALE_STATUSES = ['Pending to Sell','Sold'];
const RECEIVE_STATUSES = ['Receivable','Received'];

let __selectedAllotIds = new Set();

function viewAllotments(){
  const apps = S.applications.filter(a=>a.applicationStatus==='Applied' || a.allotmentStatus==='Allotted' || a.allotmentStatus==='Not Allotted');
  const allotted = apps.filter(a=>a.allotmentStatus==='Allotted');
  const notAllotted = apps.filter(a=>a.allotmentStatus==='Not Allotted');
  const pending = apps.filter(a=>!a.allotmentStatus || a.allotmentStatus==='Pending Decision');
  const allotRate = apps.length ? Math.round((allotted.length/apps.length)*1000)/10 : 0;
  const pendingToSell = allotted.filter(a=>a.saleStatus!=='Sold');
  const totalOurProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.ourFinal:0); },0);
  const totalClientProfit = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable?c.clientFinal:0); },0);
  const totalReceived = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable && a.amountReceiveStatus==='Received' ? c.grossFinal : 0); },0);
  const totalReceivable = apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s + (c.applicable && a.amountReceiveStatus==='Receivable' ? c.grossFinal : 0); },0);

  window.__tableRerender['allotTbl'] = () => {
    document.getElementById('allotTblWrap').innerHTML = renderDataTable('allotTbl', {
      data: apps,
      searchFn: (r,q) => { const c=findClient(r.clientId), i=findIpo(r.ipoId); return ((c?c.clientName:'')+' '+(i?i.ipoName:'')).toLowerCase().includes(q); },
      searchPlaceholder: 'Search client, IPO...',
      filters: [
        { key:'allotmentStatus', label:'Allotment', options: ALLOTMENT_STATUSES },
        { key:'saleStatus', label:'Sale', options: SALE_STATUSES },
        { key:'amountReceiveStatus', label:'Amount', options: RECEIVE_STATUSES },
        { key:'ipoId', label:'IPO', options: S.ipos.map(i=>i.ipoName), match:(r,v)=>{ const i=findIpo(r.ipoId); return i && i.ipoName===v; } }
      ],
      pageSize: 12,
      columns: [
        { key:'sel', label:`<input type="checkbox" onchange="toggleAllAllotSelection(this.checked)">`, render:r=>`<input type="checkbox" class="allotSelCk" ${__selectedAllotIds.has(r.id)?'checked':''} onchange="toggleAllotSelection(${r.id}, this.checked)">` },
        { key:'clientId', label:'Client', render:r=>{ const c=findClient(r.clientId); return escapeHtml(c?c.clientName:'—'); } },
        { key:'ipoId', label:'IPO', render:r=>{ const i=findIpo(r.ipoId); return escapeHtml(i?i.ipoName:'—'); } },
        { key:'amountApplied', label:'Amount Applied', render:r=>fmtMoney(r.amountApplied) },
        { key:'allotmentStatus', label:'Allotment', render:r=>badge(r.allotmentStatus||'Pending Decision') },
        { key:'allotmentDate', label:'Allotment Date', render:r=>fmtDate(r.allotmentDate) },
        { key:'saleStatus', label:'Sale', render:r=>r.saleStatus?badge(r.saleStatus):'—' },
        { key:'saleDate', label:'Sale Date', render:r=>fmtDate(r.saleDate) },
        { key:'saleAmount', label:'Sale Amount', render:r=>fmtMoney(r.saleAmount) },
        { key:'grossReceived', label:'Gross Received', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.grossFinal)+(c.grossOverridden?' <span class="badge gold">Ovr</span>':'')):'—'; } },
        { key:'amountReceiveStatus', label:'Amount Status', render:r=>r.amountReceiveStatus?badge(r.amountReceiveStatus):'—' },
        { key:'ourProfit', label:'Our Profit', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.ourFinal)+(c.ourOverridden?' <span class="badge gold">Ovr</span>':'')):'—'; } },
        { key:'clientProfit', label:'Client Profit', render:r=>{ const c=calcAllotmentSale(r); return c.applicable?(fmtMoney(c.clientFinal)+(c.clientOverridden?' <span class="badge gold">Ovr</span>':'')):'—'; } }
      ],
      rowActions: r => `<button class="btn btn-sm btn-primary" onclick="editAllotmentSale(${r.id})">Update</button>`
    });
  };
  setTimeout(()=>window.__tableRerender['allotTbl'](), 0);

  return `
  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Allotments</div><div class="val ok">${allotted.length}</div></div>
    <div class="kpi-card"><div class="lbl">Not Allotted</div><div class="val danger">${notAllotted.length}</div></div>
    <div class="kpi-card"><div class="lbl">Pending Decision</div><div class="val">${pending.length}</div></div>
    <div class="kpi-card"><div class="lbl">Allotment Rate</div><div class="val">${allotRate}%</div></div>
    <div class="kpi-card"><div class="lbl">Pending to Sell</div><div class="val gold">${pendingToSell.length}</div></div>
    <div class="kpi-card"><div class="lbl">Total Our Profit</div><div class="val ok">${fmtMoney(totalOurProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Client Profit</div><div class="val">${fmtMoney(totalClientProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Received</div><div class="val ok">${fmtMoney(totalReceived)}</div></div>
    <div class="kpi-card"><div class="lbl">Total Receivable</div><div class="val gold">${fmtMoney(totalReceivable)}</div></div>
  </div>
  <div class="section-card">
    <div class="sc-head" style="flex-wrap:wrap;gap:10px;">
      <h3>Allotments &amp; Sale</h3><div class="spacer"></div>
      <span class="small-muted">Selected: ${__selectedAllotIds.size}</span>
      <button class="btn btn-ghost btn-sm" onclick="clearAllotSelection()">Clear Selection</button>
    </div>
    <div class="sc-body" style="padding-bottom:8px;">
      <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;padding:10px 0 14px;border-bottom:1px solid var(--border);margin-bottom:12px;">
        <div class="f-group" style="min-width:200px;">
          <label>Bulk Update — Allotment Status</label>
          <div style="display:flex;gap:6px;">
            <select id="bulkAllotStatusSelect">${ALLOTMENT_STATUSES.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateAllotmentStatus()">Update</button>
          </div>
        </div>
        <div class="f-group" style="min-width:200px;">
          <label>Bulk Update — Sale Date</label>
          <div style="display:flex;gap:6px;">
            <input type="date" id="bulkSaleDateInput">
            <button class="btn btn-ghost btn-sm" onclick="bulkUpdateSaleDate()">Apply</button>
          </div>
          <div class="hint">Only applies to selected rows that are already Allotted; also sets Sale Status to Sold.</div>
        </div>
      </div>
      <div id="allotTblWrap"></div>
    </div>
  </div>
  <p class="small-muted">There is no partial sale — the entire allotted lot is sold in a single transaction. Gross Received = Applied Amount + 50% × (Sale Amount − Applied Amount); calculated automatically once Allotted + Sold, and independently overridable. Allotment Date is fixed at the IPO level (see IPOs tab) and cannot be edited per application.</p>`;
}
function toggleAllotSelection(id, checked){ if (checked) __selectedAllotIds.add(id); else __selectedAllotIds.delete(id); navigate('allotments'); }
function toggleAllAllotSelection(checked){
  const filteredIds = (window.__lastFilteredIds && window.__lastFilteredIds['allotTbl']) || [];
  if (checked) filteredIds.forEach(id => __selectedAllotIds.add(id));
  else filteredIds.forEach(id => __selectedAllotIds.delete(id));
  navigate('allotments');
}
function clearAllotSelection(){ __selectedAllotIds = new Set(); navigate('allotments'); }

async function bulkUpdateAllotmentStatus(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const status = document.getElementById('bulkAllotStatusSelect').value;
  let count = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a) continue;
    const ipo = findIpo(a.ipoId);
    const patch = { allotmentStatus: status, allotmentDate: ipo ? (ipo.allotmentDate || null) : null };
    if (status === 'Not Allotted'){ patch.saleStatus = null; patch.saleDate = null; patch.saleAmount = null; }
    else if (status === 'Allotted'){ if (a.saleStatus !== 'Sold') patch.saleStatus = 'Pending to Sell'; }
    else { patch.saleStatus = null; }
    const updated = { ...a, ...patch, updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, a, updated);
    count++;
  }
  toast(`Allotment status updated for ${count} row(s)`, 'ok');
  navigate('allotments');
}
async function bulkUpdateSaleDate(){
  if (!__selectedAllotIds.size){ toast('No rows selected','warn'); return; }
  const dateVal = document.getElementById('bulkSaleDateInput').value;
  if (!dateVal){ toast('Pick a sale date first','warn'); return; }
  let count = 0, skipped = 0;
  for (const id of __selectedAllotIds){
    const a = findApp(id);
    if (!a || a.allotmentStatus !== 'Allotted'){ skipped++; continue; }
    const updated = { ...a, saleDate: dateVal, saleStatus: 'Sold', updatedAt: new Date().toISOString() };
    await putRec('applications', updated); Object.assign(a, updated);
    await audit('Allotment Updates','Application', id, a, updated);
    count++;
  }
  toast(`Sale date applied to ${count} row(s)${skipped?`, ${skipped} skipped (not Allotted)`:''}`, 'ok');
  navigate('allotments');
}

function allotmentSaleModalBody(a){
  const calc = calcAllotmentSale(a);
  const ipo = findIpo(a.ipoId);
  const saleSectionDisabled = a.allotmentStatus !== 'Allotted';
  return `<div class="form-grid">
      ${fieldHtml({key:'allotmentStatus',label:'Allotment Status',type:'select',options:ALLOTMENT_STATUSES,onchange:'onAllotmentStatusChange()'}, a.allotmentStatus||'Pending Decision')}
      <div class="f-group"><label>Allotment Date</label><div class="small-muted" style="padding:8px 0;">${ipo && ipo.allotmentDate ? fmtDate(ipo.allotmentDate) : 'Not set on this IPO yet'} <span class="badge gray">Locked — set on the IPO</span></div></div>
      <div class="f-group"><label>Sale Status</label><select id="fld_saleStatus" ${saleSectionDisabled?'disabled':''} onchange="onSaleStatusChange()">
        <option value="">—</option>
        ${SALE_STATUSES.map(s=>`<option value="${s}" ${a.saleStatus===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      ${fieldHtml({key:'saleDate',label:'Sale Date',type:'date'}, a.saleDate||'')}
      ${fieldHtml({key:'saleAmount',label:'Sale Amount (total for the full allotted lot)',type:'number'}, a.saleAmount!=null?a.saleAmount:'')}
    </div>
    <div id="grossOurClientWrap" style="margin-top:14px;">${grossOurClientFieldsHtml(a, calc)}</div>
    <p class="hint">Applied Amount: ${fmtMoney(a.amountApplied)}${a.applicationStatus!=='Applied'?'<br><b>Note:</b> allotment results are normally only entered once the application status is "Applied".':''}</p>`;
}
function grossOurClientFieldsHtml(a, calc){
  return `<div class="form-grid">
      ${fieldHtml({key:'grossReceived',label:'Gross Amount Received From Client',type:'number',hint:calc.applicable?`Calculated: ${fmtMoney(calc.calculatedGross)}`:'Applicable only once Allotted + Sold'}, (a.grossReceivedOverridden && a.grossReceived!=null) ? a.grossReceived : (calc.applicable?calc.calculatedGross:''))}
      ${fieldHtml({key:'amountReceiveStatus',label:'Amount Receive Status',type:'select',options:['',...RECEIVE_STATUSES],placeholder:'—'}, a.amountReceiveStatus||'')}
      ${fieldHtml({key:'ourProfit',label:'Our Profit',type:'number',hint:calc.applicable?`Calculated: ${fmtMoney(calc.calculatedOur)}`:'Gross Received − Applied Amount'}, (a.ourProfitOverridden && a.ourProfit!=null) ? a.ourProfit : (calc.applicable?calc.calculatedOur:''))}
      ${fieldHtml({key:'clientProfit',label:'Client Profit',type:'number',hint:calc.applicable?`Calculated: ${fmtMoney(calc.calculatedClient)}`:'Sale Amount − Gross Received'}, (a.clientProfitOverridden && a.clientProfit!=null) ? a.clientProfit : (calc.applicable?calc.calculatedClient:''))}
    </div>`;
}
function editAllotmentSale(id){
  const a = findApp(id);
  const c = findClient(a.clientId), i = findIpo(a.ipoId);
  openModal(`Allotment &amp; Sale — ${escapeHtml(c?c.clientName:'')} · ${escapeHtml(i?i.ipoName:'')}`,
    allotmentSaleModalBody(a),
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveAllotmentSale(${id})">Save</button>`, true);
}
function onAllotmentStatusChange(){
  const status = document.getElementById('fld_allotmentStatus').value;
  const saleSel = document.getElementById('fld_saleStatus');
  if (status !== 'Allotted'){
    saleSel.value = ''; saleSel.disabled = true;
  } else {
    saleSel.disabled = false;
    if (!saleSel.value) saleSel.value = 'Pending to Sell';
  }
  onSaleStatusChange();
}
function onSaleStatusChange(){
  // Gross/Our/Client Profit are (re)computed on save; nothing to do live here beyond enabling/disabling the Sale Status field, handled in onAllotmentStatusChange.
}
async function saveAllotmentSale(id, force){
  const data = readFields([{key:'allotmentStatus'},{key:'saleStatus'},{key:'saleDate'},{key:'saleAmount',type:'number'},{key:'grossReceived',type:'number'},{key:'amountReceiveStatus'},{key:'ourProfit',type:'number'},{key:'clientProfit',type:'number'}]);
  const a = findApp(id);
  const ipo = findIpo(a.ipoId);
  data.allotmentDate = ipo ? (ipo.allotmentDate || null) : null; // hard-locked to the IPO's allotment date

  if ((data.allotmentStatus === 'Allotted' || data.allotmentStatus === 'Not Allotted') && a.applicationStatus !== 'Applied' && !force){
    openModal('Validation Warning',
      `<p style="font-size:13px;">Allotment results are normally only entered when Application Status is "Applied". This application is currently "${escapeHtml(a.applicationStatus)}".</p><p class="small-muted">You can still save.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveAllotmentSale(${id}, true)">Save Anyway</button>`);
    return;
  }

  if (data.allotmentStatus === 'Not Allotted'){ data.saleStatus = null; data.saleDate = null; data.saleAmount = null; }
  if (data.allotmentStatus !== 'Allotted'){ data.saleStatus = null; }
  if (data.allotmentStatus === 'Allotted' && !data.saleStatus) data.saleStatus = 'Pending to Sell';
  if (!data.amountReceiveStatus) data.amountReceiveStatus = null;

  const warns = [];
  if (data.saleStatus === 'Sold' && !data.saleDate) warns.push('Sale Date is required when Sale Status is Sold.');
  if (data.saleDate && data.allotmentDate && data.saleDate < data.allotmentDate) warns.push('Sale date is before allotment date.');
  if (data.allotmentDate && a.applicationDate && data.allotmentDate < a.applicationDate) warns.push('Allotment date (from the IPO) is before this application\u2019s application date.');
  if (warns.length && !force){
    openModal('Date / Status Warning', `<p style="font-size:13px;">${warns.join('<br>')}</p><p class="small-muted">You can still save.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="saveAllotmentSale(${id}, true)">Save Anyway</button>`);
    return;
  }

  // detect manual overrides: user-entered value differs from the auto-calculated one
  const probe = { ...a, ...data };
  const calc = calcAllotmentSale({ ...probe, grossReceivedOverridden:false, ourProfitOverridden:false, clientProfitOverridden:false });
  const grossReceivedOverridden = calc.applicable && isFilled(data.grossReceived) && Number(data.grossReceived) !== calc.calculatedGross;
  const ourProfitOverridden = calc.applicable && isFilled(data.ourProfit) && Number(data.ourProfit) !== calc.calculatedOur;
  const clientProfitOverridden = calc.applicable && isFilled(data.clientProfit) && Number(data.clientProfit) !== calc.calculatedClient;

  const updated = { ...a, ...data,
    grossReceivedOverridden, ourProfitOverridden, clientProfitOverridden,
    calculatedGrossReceived: calc.applicable ? calc.calculatedGross : null,
    calculatedOurProfit: calc.applicable ? calc.calculatedOur : null,
    calculatedClientProfit: calc.applicable ? calc.calculatedClient : null,
    updatedAt: new Date().toISOString() };
  await putRec('applications', updated); Object.assign(a, updated);
  await audit('Allotment Updates','Application', id, a, updated);
  toast('Allotment / sale updated','ok');
  closeModal(); navigate('allotments');
}

</script>
<script>
/* =================== DASHBOARD =================== */
let dashRange = { preset:'thisMonth', from:null, to:null };

function fyRange(offsetYears){
  const now = new Date();
  let fyStartYear = now.getMonth() >= 3 ? now.getFullYear() : now.getFullYear()-1;
  fyStartYear -= offsetYears;
  return { from: `${fyStartYear}-04-01`, to: `${fyStartYear+1}-03-31` };
}
function resolveDashRange(){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const p = dashRange.preset;
  if (p === 'today') return { from: todayStr(), to: todayStr() };
  if (p === 'thisWeek'){
    const dow = now.getDay();
    const start = new Date(now); start.setDate(d - dow);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return { from: isoDate(start), to: isoDate(end) };
  }
  if (p === 'thisMonth') return { from: isoDate(new Date(y,m,1)), to: isoDate(new Date(y,m+1,0)) };
  if (p === 'prevMonth') return { from: isoDate(new Date(y,m-1,1)), to: isoDate(new Date(y,m,0)) };
  if (p === 'thisFY') return fyRange(0);
  if (p === 'prevFY') return fyRange(1);
  if (p === 'custom') return { from: dashRange.from || '0001-01-01', to: dashRange.to || '9999-12-31' };
  return { from: '0001-01-01', to: '9999-12-31' };
}
function inRange(dateStr, r){ return dateStr && dateStr >= r.from && dateStr <= r.to; }

function viewDashboard(){
  return `<div id="dashBody"></div>`;
}
function afterDashboard(){ document.getElementById('dashBody').innerHTML = dashboardBody(); }
function setDashPreset(p){ dashRange.preset = p; render(); }
function setDashCustom(){
  dashRange.preset = 'custom';
  dashRange.from = document.getElementById('dashFrom').value;
  dashRange.to = document.getElementById('dashTo').value;
  render();
}

function dashboardBody(){
  const r = resolveDashRange();
  const appsInRange = S.applications.filter(a => inRange(a.applicationDate, r));
  const plansInRange = S.ipoPlans.filter(p => inRange(p.plannedDate, r));
  const allottedInRange = S.applications.filter(a => inRange(a.allotmentDate, r));
  const notAllottedInRange = allottedInRange.filter(a=>a.allotmentStatus==='Not Allotted');
  const soldInRange = S.applications.filter(a => inRange(a.saleDate, r) && a.saleStatus==='Sold');
  const profitInRange = soldInRange.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.ourFinal:0); }, 0);
  const amountAppliedInRange = appsInRange.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
  const grossInRange = soldInRange.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
  const avgProfit = allottedInRange.filter(a=>a.allotmentStatus==='Allotted').length ? Math.round(profitInRange / allottedInRange.filter(a=>a.allotmentStatus==='Allotted').length) : 0;
  const pendingToSell = S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').length;
  const upcomingIpos = S.ipos.filter(i=>ipoStatus(i)==='Upcoming').length;
  const needPlanning = S.ipos.filter(i=>ipoStatus(i)!=='Closed' && upcomingPlanningStatus(i)==='Not Planned').length;

  const presetBtns = [
    ['today','Today'],['thisWeek','This Week'],['thisMonth','This Month'],['prevMonth','Previous Month'],
    ['thisFY','Current FY'],['prevFY','Previous FY'],['custom','Custom']
  ].map(([k,l]) => `<button class="btn btn-sm ${dashRange.preset===k?'btn-primary':'btn-ghost'}" onclick="setDashPreset('${k}')">${l}</button>`).join('');

  const attn = buildAttentionList();
  const attnHtml = attn.length ? attn.map(a=>`<div class="attn-item ${a.level}"><span class="tag">${a.level}</span><span>${a.text}</span></div>`).join('')
    : `<div class="small-muted">Nothing needs attention right now.</div>`;

  return `
  <div class="section-card">
    <div class="sc-body" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">
      ${presetBtns}
      ${dashRange.preset==='custom' ? `<input type="date" id="dashFrom" value="${dashRange.from||''}" onchange="setDashCustom()"><span>to</span><input type="date" id="dashTo" value="${dashRange.to||''}" onchange="setDashCustom()">` : ''}
      <span class="small-muted" style="margin-left:auto;">Showing: ${fmtDate(r.from)} – ${fmtDate(r.to)}</span>
    </div>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Clients</div><div class="val">${S.clients.length}</div></div>
    <div class="kpi-card"><div class="lbl">Total IPOs</div><div class="val">${S.ipos.length}</div></div>
    <div class="kpi-card"><div class="lbl">Applications (period)</div><div class="val">${appsInRange.length}</div></div>
    <div class="kpi-card"><div class="lbl">Allotments (period)</div><div class="val ok">${allottedInRange.filter(a=>a.allotmentStatus==='Allotted').length}</div></div>
    <div class="kpi-card"><div class="lbl">Not Allotted (period)</div><div class="val danger">${notAllottedInRange.length}</div></div>
    <div class="kpi-card"><div class="lbl">Sold (period)</div><div class="val">${soldInRange.length}</div></div>
    <div class="kpi-card"><div class="lbl">Amount Applied (period)</div><div class="val">${fmtMoney(amountAppliedInRange)}</div></div>
    <div class="kpi-card"><div class="lbl">Gross Received (period)</div><div class="val">${fmtMoney(grossInRange)}</div></div>
    <div class="kpi-card"><div class="lbl">Our Profit (period)</div><div class="val gold">${fmtMoney(profitInRange)}</div></div>
    <div class="kpi-card"><div class="lbl">Avg Profit / Allotment</div><div class="val">${fmtMoney(avgProfit)}</div></div>
    <div class="kpi-card"><div class="lbl">Pending to Sell</div><div class="val">${pendingToSell}</div></div>
    <div class="kpi-card"><div class="lbl">Upcoming IPOs</div><div class="val">${upcomingIpos}</div></div>
    <div class="kpi-card"><div class="lbl">IPOs Requiring Planning</div><div class="val danger">${needPlanning}</div></div>
  </div>
  <p class="small-muted">Date basis: Applications use Application Date · Planning uses Planned Date · Allotments use Allotment Date · Profit/Sales use Sale Date.</p>

  <div class="section-card">
    <div class="sc-head"><h3>What Needs Attention?</h3></div>
    <div class="sc-body attn-list">${attnHtml}</div>
  </div>

  ${operationalDailyPlannerHtml()}
  `;
}

function buildAttentionList(){
  const items = [];
  const today = todayStr();
  const tomorrow = isoDate(new Date(Date.now()+86400000));
  S.ipos.forEach(i=>{
    if (i.openDate===today) items.push({level:'high', text:`IPO opening today: ${escapeHtml(i.ipoName)}`});
    if (i.openDate===tomorrow) items.push({level:'med', text:`IPO opening tomorrow: ${escapeHtml(i.ipoName)}`});
    if (i.closeDate===today) items.push({level:'high', text:`IPO closing today: ${escapeHtml(i.ipoName)}`});
    if (i.closeDate===tomorrow) items.push({level:'med', text:`IPO closing tomorrow: ${escapeHtml(i.ipoName)}`});
    if (ipoStatus(i)!=='Closed' && upcomingPlanningStatus(i)==='Not Planned') items.push({level:'med', text:`IPO not planned: ${escapeHtml(i.ipoName)}`});
  });
  S.bankAccounts.filter(b=>b.status==='Active').forEach(b=>{
    const cap = bankCapacity(b.id, today);
    if (cap.status==='Over Capacity') items.push({level:'high', text:`Bank capacity exceeded: ${escapeHtml(b.bankName)} today (${cap.planned}/6)`});
    else if (cap.status==='Full' || cap.status==='Near Capacity') items.push({level:'med', text:`Bank capacity nearly full: ${escapeHtml(b.bankName)} today (${cap.planned}/6)`});
  });
  S.ipoPlans.forEach(p=>{ if (planVariance(p)==='Pending' && p.plannedDate < today) items.push({level:'med', text:`Planned application not yet executed: ${escapeHtml(findIpo(p.ipoId)?.ipoName||'')} (${fmtDate(p.plannedDate)})`}); });
  S.applications.filter(a=>a.allotmentStatus==='Allotted' && a.saleStatus!=='Sold').forEach(a=>{ const c=findClient(a.clientId); items.push({level:'low', text:`Pending to sell: ${escapeHtml(c?c.clientName:'')} — ${escapeHtml(findIpo(a.ipoId)?.ipoName||'')}`}); });
  const order = {high:0, med:1, low:2};
  return items.sort((a,b)=>order[a.level]-order[b.level]).slice(0,20);
}

function operationalDailyPlannerHtml(){
  const today = todayStr();
  const activeBanks = S.bankAccounts.filter(b=>b.status==='Active');
  const bankBlocks = activeBanks.map(b=>{
    const cap = bankCapacity(b.id, today);
    const list = cap.plans.map(p=>{ const ipo=findIpo(p.ipoId); return `<li>${escapeHtml(ipo?ipo.ipoName:'')}</li>`; }).join('');
    return `<div style="margin-bottom:8px;"><b>${escapeHtml(b.bankName)}</b> — <span class="cap-cell ${capClass(cap.status)}">${cap.planned}/6</span>
      ${list?`<ul style="margin:4px 0 0 18px;font-size:12px;">${list}</ul>`:'<div class="small-muted">No IPOs planned today</div>'}</div>`;
  }).join('') || '<div class="small-muted">No active bank accounts.</div>';

  const plannedClientsToday = S.ipoPlans.filter(p=>p.plannedDate===today).reduce((s,p)=>s+(S.plannedClients.filter(pc=>pc.planId===p.id).length),0);
  const appsToday = S.applications.filter(a=>a.applicationDate===today).length;
  const pendingToday = Math.max(0, plannedClientsToday - appsToday);

  const closingToday = S.ipos.filter(i=>i.closeDate===today).length;
  const fullBanks = activeBanks.filter(b=>bankCapacity(b.id,today).status!=='Available').length;
  const notAppliedYet = plannedClientsToday - appsToday;

  return `
  <div class="section-card">
    <div class="sc-head"><h3>Operational Daily Planner — ${fmtDate(today)}</h3></div>
    <div class="sc-body">
      <div class="form-grid">
        <div><b>IPO Applications by Bank</b>${bankBlocks}</div>
        <div>
          <b>Client Work</b>
          <ul style="margin:8px 0 0 18px;font-size:12.5px;line-height:1.8;">
            <li>${plannedClientsToday} clients planned</li>
            <li>${appsToday} applications completed</li>
            <li>${pendingToday} pending</li>
          </ul>
          <b>Alerts</b>
          <ul style="margin:8px 0 0 18px;font-size:12.5px;line-height:1.8;">
            <li>${closingToday} IPO(s) closing today</li>
            <li>${fullBanks} bank(s) at/near full capacity</li>
            <li>${Math.max(0,notAppliedYet)} client(s) not yet applied</li>
          </ul>
        </div>
      </div>
    </div>
  </div>`;
}
</script>
<script>
/* =================== REPORTS =================== */
let reportsTab = 'client';
function viewReports(){
  return `
  <div class="tabs">
    <button class="${reportsTab==='client'?'active':''}" onclick="setReportsTab('client')">Client Analysis</button>
    <button class="${reportsTab==='ipo'?'active':''}" onclick="setReportsTab('ipo')">IPO Analysis</button>
    <button class="${reportsTab==='bank'?'active':''}" onclick="setReportsTab('bank')">Bank Analysis</button>
    <button class="${reportsTab==='capacity'?'active':''}" onclick="setReportsTab('capacity')">Bank Capacity Analysis</button>
    <button class="${reportsTab==='planning'?'active':''}" onclick="setReportsTab('planning')">Planning Performance</button>
    <button class="${reportsTab==='pva'?'active':''}" onclick="setReportsTab('pva')">Planned vs Actual</button>
  </div>
  <div id="reportsTabBody">${reportsTabContent()}</div>`;
}
function setReportsTab(t){ reportsTab = t; render(); }
function reportsTabContent(){
  if (reportsTab==='client') return reportClientAnalysis();
  if (reportsTab==='ipo') return reportIpoAnalysis();
  if (reportsTab==='bank') return reportBankAnalysis();
  if (reportsTab==='capacity') return planningCapacityTab();
  if (reportsTab==='planning') return reportPlanningPerformance();
  if (reportsTab==='pva') return planningVarianceTab();
  return '';
}
function reportClientAnalysis(){
  const rows = S.clients.map(c=>{
    const st = clientStats(c.id);
    return `<tr><td>${escapeHtml(c.clientName)}</td><td>${st.apps.length}</td><td>${st.allotted.length}</td><td>${st.notAllotted.length}</td><td>${st.sold.length}</td><td>${fmtMoney(st.amountApplied)}</td><td>${fmtMoney(st.grossReceived)}</td><td>${fmtMoney(st.profit)}</td><td>${fmtMoney(st.clientProfit)}</td></tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="9">No clients yet.</td></tr>`;
  return `<div class="section-card"><div class="sc-body table-wrap"><table class="dt"><thead><tr><th>Client</th><th>Applications</th><th>Allotments</th><th>Not Allotted</th><th>Sold</th><th>Amount Applied</th><th>Gross Received</th><th>Our Profit</th><th>Client Profit</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function reportIpoAnalysis(){
  const rows = S.ipos.map(i=>{
    const st = ipoStats(i.id);
    const notAllotted = st.apps.filter(a=>a.allotmentStatus==='Not Allotted').length;
    const sold = st.apps.filter(a=>a.saleStatus==='Sold').length;
    const amountApplied = st.apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
    const gross = st.apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
    return `<tr><td>${escapeHtml(i.ipoName)}</td><td>${st.apps.length}</td><td>${st.allotted.length}</td><td>${notAllotted}</td><td>${sold}</td><td>${fmtMoney(amountApplied)}</td><td>${fmtMoney(gross)}</td><td>${fmtMoney(st.profit)}</td></tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="8">No IPOs yet.</td></tr>`;
  return `<div class="section-card"><div class="sc-body table-wrap"><table class="dt"><thead><tr><th>IPO</th><th>Applications</th><th>Allotments</th><th>Not Allotted</th><th>Sold</th><th>Amount Applied</th><th>Gross Received</th><th>Our Profit</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function reportBankAnalysis(){
  const rows = S.bankAccounts.map(b=>{
    const st = bankStats(b.id);
    const actualIpoIds = new Set(st.apps.map(a=>a.ipoId));
    const amountApplied = st.apps.reduce((s,a)=>s+(Number(a.amountApplied)||0),0);
    const gross = st.apps.reduce((s,a)=>{ const c=calcAllotmentSale(a); return s+(c.applicable?c.grossFinal:0); },0);
    return `<tr><td>${escapeHtml(b.bankName)}</td><td>${st.plans.length}</td><td>${actualIpoIds.size}</td><td>${st.apps.length}</td><td>${st.apps.filter(a=>a.allotmentStatus==='Allotted').length}</td><td>${fmtMoney(amountApplied)}</td><td>${fmtMoney(gross)}</td><td>${fmtMoney(st.profit)}</td></tr>`;
  }).join('') || `<tr class="empty-row"><td colspan="8">No bank accounts yet.</td></tr>`;
  return `<div class="section-card"><div class="sc-body table-wrap"><table class="dt"><thead><tr><th>Bank</th><th>Planned IPOs</th><th>Actual IPOs</th><th>Applications</th><th>Allotments</th><th>Amount Applied</th><th>Gross Received</th><th>Our Profit</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function reportPlanningPerformance(){
  const totalPlanned = S.ipoPlans.length;
  const totalActual = new Set(S.applications.filter(a=>a.planId).map(a=>a.planId)).size;
  const executed = S.ipoPlans.filter(p=>planVariance(p)==='Matched').length;
  const notExecuted = S.ipoPlans.filter(p=>planVariance(p)==='Pending').length;
  const bankChanged = S.ipoPlans.filter(p=>planVariance(p)==='Bank Changed').length;
  const dateChanged = S.ipoPlans.filter(p=>planVariance(p)==='Date Changed').length;
  const dateSet = new Set(S.ipoPlans.map(p=>p.plannedDate));
  let overCapacityDays = 0, utilSum = 0, utilCount = 0;
  S.bankAccounts.forEach(b=>{ dateSet.forEach(d=>{ const cap = bankCapacity(b.id,d); if (cap.planned>0){ utilSum += cap.utilisation; utilCount++; if (cap.status==='Over Capacity') overCapacityDays++; } }); });
  const avgUtil = utilCount ? Math.round((utilSum/utilCount)*10)/10 : 0;
  return `<div class="kpi-grid">
    <div class="kpi-card"><div class="lbl">Total Planned IPO Slots</div><div class="val">${totalPlanned}</div></div>
    <div class="kpi-card"><div class="lbl">Total Actual IPO Slots</div><div class="val">${totalActual}</div></div>
    <div class="kpi-card"><div class="lbl">Plans Executed</div><div class="val ok">${executed}</div></div>
    <div class="kpi-card"><div class="lbl">Plans Not Executed</div><div class="val danger">${notExecuted}</div></div>
    <div class="kpi-card"><div class="lbl">Plans With Bank Change</div><div class="val">${bankChanged}</div></div>
    <div class="kpi-card"><div class="lbl">Plans With Date Change</div><div class="val">${dateChanged}</div></div>
    <div class="kpi-card"><div class="lbl">Over-Capacity Days</div><div class="val danger">${overCapacityDays}</div></div>
    <div class="kpi-card"><div class="lbl">Average Bank Utilisation</div><div class="val">${avgUtil}%</div></div>
  </div>`;
}

          ${S.settings.authorizedEmail ? `<div class="f-group span2"><label>Authorized Google Account</label><div class="small-muted">${escapeHtml(S.settings.authorizedEmail)} — only this account can sign in and access this portal's data.</div></div>` : `<div class="f-group span2"><label>Authorized Google Account</label><div class="small-muted">Not set yet — the first account that connects becomes the authorized account.</div></div>`}
        </div>

  <div class="section-card">

}
async function addReference(){
  const input = document.getElementById('newRefInput');
  const val = input.value.trim();
  if (!val) return;
  if (!S.settings.references.includes(val)) S.settings.references.push(val);
  await saveSetting('references', S.settings.references);
  navigate('settings');
}
async function removeReference(val){
  S.settings.references = S.settings.references.filter(r=>r!==val);
  await saveSetting('references', S.settings.references);
  navigate('settings');
}

<script>

function toExcelDate(str){ if(!str) return null; const d = new Date(str); if (isNaN(d)) return null; return d; }
function exportAllToExcel(){
  const wb = XLSX.utils.book_new();

  const clientsSheet = S.clients.map(c=>({ 'Client ID':c.clientId, 'Client Name':c.clientName, 'Reference':c.referenceName, 'Sub Reference':c.subReference, 'Status':c.status, 'Date Added': toExcelDate(c.createdAt) }));

  const banksSheet = S.bankAccounts.map(b=>({ 'Bank ID':b.bankId, 'Bank Name':b.bankName, 'Account Holder':b.accountHolderName, 'Status':b.status, 'UPI IDs': bankUpis(b.id).map(u=>u.upiId).join(', ') }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(banksSheet), 'Bank Accounts');

  const upiSheet = S.bankUpiIds.map(u=>{ const b=findBank(u.bankAccountId); return { 'Bank':b?b.bankName:'', 'UPI ID':u.upiId }; });

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(iposSheet), 'IPOs');

  const plansSheet = S.ipoPlans.map(p=>{ const ipo=findIpo(p.ipoId), bank=findBank(p.bankAccountId); return { 'Plan ID':p.id, 'IPO':ipo?ipo.ipoName:'', 'Planned Date':toExcelDate(p.plannedDate), 'Bank':bank?bank.bankName:'', 'Planned Clients':p.plannedClientCount||0, 'Status':planStatusComputed(p), 'Variance':planVariance(p), 'Notes':p.notes||'' }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(plansSheet), 'IPO Plans');

  const plannedClientsSheet = S.plannedClients.map(pc=>{ const c=findClient(pc.clientId), plan=findPlan(pc.planId), ipo=plan?findIpo(plan.ipoId):null; return { 'Plan ID':pc.planId, 'IPO':ipo?ipo.ipoName:'', 'Client ID':c?c.clientId:'', 'Client Name':c?c.clientName:'' }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(plannedClientsSheet), 'Planned Clients');

  const appsSheet = S.applications.map(a=>{ const c=findClient(a.clientId), i=findIpo(a.ipoId), b=findBank(a.bankAccountId); const u=S.bankUpiIds.find(x=>x.id===a.upiId); const calc=calcAllotmentSale(a); return {
    'Application ID':a.id,'Client ID':c?c.clientId:'','Client Name':c?c.clientName:'','IPO':i?i.ipoName:'','Bank':b?b.bankName:'','Application Date':toExcelDate(a.applicationDate),
    'UPI ID':u?u.upiId:'','Amount Applied':Number(a.amountApplied)||0,'Status':a.applicationStatus,'Plan ID':a.planId||'','Allotment Status':a.allotmentStatus||'',
    'Allotment Date':toExcelDate(a.allotmentDate),'Sale Status':a.saleStatus||'','Sale Date':toExcelDate(a.saleDate),'Sale Amount':Number(a.saleAmount)||0,
    'Gross Received':calc.applicable?calc.grossFinal:'','Amount Receive Status':a.amountReceiveStatus||'','Our Profit':calc.applicable?calc.ourFinal:'','Client Profit':calc.applicable?calc.clientFinal:'' }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(appsSheet), 'Applications');

  const allotmentsSheet = S.applications.filter(a=>a.allotmentStatus && a.allotmentStatus!=='Pending Decision').map(a=>{ const c=findClient(a.clientId), i=findIpo(a.ipoId); return { 'Client':c?c.clientName:'','IPO':i?i.ipoName:'','Allotment Status':a.allotmentStatus,'Allotment Date':toExcelDate(a.allotmentDate) }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(allotmentsSheet), 'Allotments');

  const salesSheet = S.applications.filter(a=>a.saleStatus==='Sold').map(a=>{ const c=findClient(a.clientId), i=findIpo(a.ipoId); const calc=calcAllotmentSale(a); return { 'Client':c?c.clientName:'','IPO':i?i.ipoName:'','Sale Date':toExcelDate(a.saleDate),'Sale Amount':Number(a.saleAmount)||0,'Gross Received':calc.applicable?calc.grossFinal:'','Amount Applied':Number(a.amountApplied)||0,'Our Profit':calc.applicable?calc.ourFinal:'','Client Profit':calc.applicable?calc.clientFinal:'' }; });

  const profitSummary = [{
    'Total Amount Applied': S.applications.reduce((s,a)=>s+(Number(a.amountApplied)||0),0),

  }];

  const clientSummary = S.clients.map(c=>{ const st=clientStats(c.id); return { 'Client':c.clientName,'Applications':st.apps.length,'Allotments':st.allotted.length,'Sold':st.sold.length,'Amount Applied':st.amountApplied,'Gross Received':st.grossReceived,'Our Profit':st.profit }; });

  const ipoSummary = S.ipos.map(i=>{ const st=ipoStats(i.id); return { 'IPO':i.ipoName,'Applications':st.apps.length,'Allotments':st.allotted.length,'Our Profit':st.profit }; });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ipoSummary), 'IPO Summary');

  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(planningAnalysisSheet), 'Planning Analysis');

  const auditSheet = S.auditLogs.map(l=>({ 'Timestamp':l.timestamp,'Action':l.action,'Entity':l.entity,'Entity ID':l.entityId }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(auditSheet), 'Audit Logs');

  XLSX.writeFile(wb, `IPO_Portal_Export_${todayStr()}.xlsx`);
  toast('Excel export downloaded','ok');
}

/* =================== LOCAL BACKUP (JSON) =================== */
function snapshotData(){
  return {
    version: DB_VERSION, exportedAt: new Date().toISOString(),
    clients: S.clients, bankAccounts: S.bankAccounts, ipos: S.ipos, ipoPlans: S.ipoPlans,
    plannedClients: S.plannedClients, applications: S.applications, bankUpiIds: S.bankUpiIds,
    settings: S.settings, auditLogs: S.auditLogs
  };
}
function localBackupDownload(){
  const blob = new Blob([JSON.stringify(snapshotData(), null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `ipo_portal_backup_${todayStr()}.json`; a.click();
  URL.revokeObjectURL(url);
  toast('Backup downloaded','ok');
}
async function restoreSnapshot(data){
  for (const [store, keyPath] of Object.entries(STORES)){
    if (store === 'settings') continue;
    await clearStore(store);
    const arr = data[store] || [];
    for (const rec of arr) await putRec(store, rec);
  }
  if (data.settings){
    for (const [k,v] of Object.entries(data.settings)) await saveSetting(k, v);
  }
  await loadAll();
}
function localBackupRestore(file){
  if (!file) return;
  confirmAction('Restoring will replace all current data with the contents of this backup file. Continue?', () => {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const data = JSON.parse(e.target.result);
        await restoreSnapshot(data);
        await saveSetting('lastRestore', new Date().toISOString());
        toast('Backup restored','ok');
        navigate('dashboard');
      } catch(err){ toast('Invalid backup file','danger'); }
    };
    reader.readAsText(file);
  });
}

/* =================== GOOGLE DRIVE — SOURCE OF TRUTH, INDEXEDDB AS LOCAL CACHE =================== */
const DRIVE_FOLDER_NAME = 'IPO Management Portal';
const DRIVE_FILE_NAME = 'ipo_management_portal_data.json';
const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';

window.__drive = {
  signedIn: false, email: null, accessToken: null,
  folderId: null, fileId: null, remoteModifiedTime: null,
  status: 'idle', // idle | saving | syncing | offline | conflict | error | denied
  pendingChanges: false, syncTimer: null
};

function loadGis(){
  return new Promise((resolve) => {
    if (window.google && window.google.accounts) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = resolve;
    s.onerror = resolve;
    document.head.appendChild(s);
  });
}
function setDriveStatus(status){
  window.__drive.status = status;
  renderSyncIndicator();
  if (S.view === 'settings') { const b = document.getElementById('contentSettingsRerenderHook'); if (b) navigate('settings'); }
}
function renderSyncIndicator(){
  const el = document.getElementById('syncIndicator');
  if (!el) return;
  const labels = {
    idle: window.__drive.signedIn ? 'Saved to Google Drive' : '',
    saving: 'Saving...', syncing: 'Syncing...', offline: 'Offline — changes will sync when connection is restored',
    conflict: 'Data updated elsewhere — refresh to continue', error: 'Sync failed — Retry', denied: 'Access Denied'
  };
  const text = labels[window.__drive.status] || '';
  el.textContent = text;
  el.style.display = text ? 'inline-block' : 'none';
  el.className = 'badge ' + ({idle:'green',saving:'gold',syncing:'gold',offline:'gray',conflict:'red',error:'red',denied:'red'}[window.__drive.status] || 'gray');
  el.onclick = (window.__drive.status==='error') ? syncToDrive : (window.__drive.status==='conflict' ? refreshFromDrive : null);
  el.style.cursor = el.onclick ? 'pointer' : 'default';
}

/* ---- centralized sync trigger: called after every real data mutation via audit() ---- */
function scheduleSync(){
  if (!window.__drive.signedIn) return;
  window.__drive.pendingChanges = true;
  if (!navigator.onLine){ setDriveStatus('offline'); return; }
  setDriveStatus('saving');
  if (window.__drive.syncTimer) clearTimeout(window.__drive.syncTimer);
  window.__drive.syncTimer = setTimeout(() => { syncToDrive(); }, 1200);
}
window.addEventListener('online', () => { if (window.__drive.signedIn && window.__drive.pendingChanges) syncToDrive(); });
window.addEventListener('offline', () => { if (window.__drive.signedIn) setDriveStatus('offline'); });

async function driveConnect(){
  await loadGis();
  if (!window.google || !window.google.accounts){ toast('Could not load Google Identity Services (check network/connectivity)','danger'); return; }
  await loadGoogleClientId();
  const clientId = S.settings.driveClientId;
  if (!clientId){ toast('Enter a Google OAuth Client ID in Settings first','warn'); return; }
  const tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: clientId,
    scope: DRIVE_SCOPE + ' https://www.googleapis.com/auth/userinfo.email',
    callback: async (resp) => {
      if (!resp || !resp.access_token){ toast('Google Drive connection failed','danger'); return; }
      window.__drive.accessToken = resp.access_token;
      await driveVerifyAndBootstrap();
    }
  });
  tokenClient.requestAccessToken();
}
async function loadGoogleClientId(){ /* placeholder for symmetry — client id comes from Settings input */ }

async function driveVerifyAndBootstrap(){
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: `Bearer ${window.__drive.accessToken}` } });
    const info = await res.json();
    const email = (info.email || '').toLowerCase();
    const authorized = (S.settings.authorizedEmail || '').toLowerCase();
    if (authorized && email !== authorized){
      setDriveStatus('denied');
      openModal('Access Denied',
        `<p style="font-size:13px;">Access Denied — This Google account is not authorized to use the IPO Management Portal.</p>
         <p class="small-muted">Signed in as ${escapeHtml(info.email||'')}. Authorized account: ${escapeHtml(S.settings.authorizedEmail)}.</p>`,
        `<button class="btn btn-primary" onclick="closeModal()">OK</button>`);
      window.__drive.accessToken = null;
      window.__drive.signedIn = false;
      return;
    }
    if (!authorized){ await saveSetting('authorizedEmail', email); }
    window.__drive.email = info.email;
    window.__drive.signedIn = true;
    await saveSetting('driveConnectedEmail', info.email);
    toast('Google Drive connected — this account is now the authorized account for this portal','ok');
    await driveBootstrapFolderAndFile();
    navigate('settings');
  } catch(err){ toast('Google Drive sign-in failed','danger'); }
}

async function driveApi(url, opts={}){
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers||{}), Authorization: `Bearer ${window.__drive.accessToken}` } });
  if (!res.ok) throw new Error('Drive API error ' + res.status);
  return res;
}
async function driveFindFolder(){
  const q = encodeURIComponent(`name='${DRIVE_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const json = await res.json();
  return (json.files && json.files[0]) || null;
}
async function driveCreateFolder(){
  const res = await driveApi('https://www.googleapis.com/drive/v3/files', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: DRIVE_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
  });
  return await res.json();
}
async function driveFindFile(folderId){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and '${folderId}' in parents and trashed=false`);
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`);
  const json = await res.json();
  return (json.files && json.files[0]) || null;
}
async function driveCreateFile(folderId){
  const metadata = { name: DRIVE_FILE_NAME, parents: [folderId], mimeType: 'application/json' };
  const boundary = '-------ipoportal' + Date.now();
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(snapshotData())}\r\n--${boundary}--`;
  const res = await driveApi('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
    method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body
  });
  return await res.json();
}
async function driveBootstrapFolderAndFile(){
  setDriveStatus('syncing');
  let folder = S.settings.driveFolderId ? { id: S.settings.driveFolderId } : await driveFindFolder();
  if (!folder){ folder = await driveCreateFolder(); }
  window.__drive.folderId = folder.id;
  await saveSetting('driveFolderId', folder.id);

  let file = S.settings.driveFileId ? await driveGetFileMeta(S.settings.driveFileId).catch(()=>null) : null;
  if (!file) file = await driveFindFile(folder.id);
  if (!file){ file = await driveCreateFile(folder.id); }
  window.__drive.fileId = file.id;
  window.__drive.remoteModifiedTime = file.modifiedTime || null;
  await saveSetting('driveFileId', file.id);

  await refreshFromDrive(true);
  setDriveStatus('idle');
}
async function driveGetFileMeta(fileId){
  const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=id,name,modifiedTime,trashed`);
  const json = await res.json();
  if (json.trashed) throw new Error('trashed');
  return json;
}

async function syncToDrive(){
  if (!window.__drive.signedIn || !window.__drive.fileId) return;
  if (!navigator.onLine){ setDriveStatus('offline'); return; }
  setDriveStatus('syncing');
  try {
    // conflict check: has the remote file changed since we last knew about it?
    const meta = await driveGetFileMeta(window.__drive.fileId);
    if (window.__drive.remoteModifiedTime && meta.modifiedTime !== window.__drive.remoteModifiedTime){
      setDriveStatus('conflict');
      toast('Data was updated from another device. Please refresh the latest data before continuing.','warn');
      return;
    }
    const res = await driveApi(`https://www.googleapis.com/upload/drive/v3/files/${window.__drive.fileId}?uploadType=media&fields=id,modifiedTime`, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(snapshotData())
    });
    const json = await res.json();
    window.__drive.remoteModifiedTime = json.modifiedTime || meta.modifiedTime;
    window.__drive.pendingChanges = false;
    await saveSetting('lastSynced', new Date().toISOString());
    setDriveStatus('idle');
  } catch(err){
    setDriveStatus('error');
  }
}
async function refreshFromDrive(silent){
  if (!window.__drive.signedIn || !window.__drive.fileId){ toast('Connect Google Drive first','warn'); return; }
  const doRefresh = async () => {
    setDriveStatus('syncing');
    try {
      const meta = await driveGetFileMeta(window.__drive.fileId);
      const res = await driveApi(`https://www.googleapis.com/drive/v3/files/${window.__drive.fileId}?alt=media`);
      const data = await res.json();
      await restoreSnapshot(data);
      window.__drive.remoteModifiedTime = meta.modifiedTime;
      window.__drive.pendingChanges = false;
      await saveSetting('lastSynced', new Date().toISOString());
      setDriveStatus('idle');
      if (!silent){ toast('Refreshed from Google Drive','ok'); navigate('dashboard'); }
    } catch(err){ setDriveStatus('error'); if (!silent) toast('Could not refresh from Google Drive','danger'); }
  };
  if (silent) { await doRefresh(); return; }
  confirmAction('This will replace your local working copy with the latest data from Google Drive. Continue?', doRefresh);
}
function driveSignOut(){
  window.__drive.signedIn = false;
  window.__drive.accessToken = null;
  window.__drive.email = null;
  setDriveStatus('idle');
  const el = document.getElementById('syncIndicator'); if (el) el.style.display = 'none';
  toast('Signed out of Google Drive. Your data on Drive has not been changed.','ok');
  navigate('settings');
}
async function saveDriveConfig(){
  await saveSetting('driveClientId', document.getElementById('driveClientId').value.trim());
  toast('Google Drive configuration saved','ok');
}
</script>
<script>
/* =================== INIT =================== */
async function init(){
  try {
    await openDB();
    await loadAll();
    renderNav();
    navigate('dashboard');
    renderSyncIndicator();
    if (!navigator.onLine) setDriveStatus('offline');
  } catch(err){
    console.error('Portal failed to initialize:', err);
    document.getElementById('content').innerHTML =
      `<div class="section-card"><div class="sc-body">
         <h3 style="color:var(--danger);margin-top:0;">The portal failed to load</h3>
         <p style="font-size:13px;">${escapeHtml(err && err.message ? err.message : String(err))}</p>
         <p class="small-muted">Try reloading the page. If this keeps happening, your browser may have an older cached copy of the local database — clearing this site's storage (Application → IndexedDB → ipoPortalDB → Delete, in browser dev tools) and reloading will rebuild it from scratch.</p>
       </div></div>`;
  }
}
window.addEventListener('error', (e) => {
  const c = document.getElementById('content');
  if (c && !c.innerHTML.trim()) {
    c.innerHTML = `<div class="section-card"><div class="sc-body"><h3 style="color:var(--danger);margin-top:0;">Something went wrong</h3><p style="font-size:13px;">${escapeHtml(e.message||'Unknown error')}</p></div></div>`;
  }
});
init();
</script>
